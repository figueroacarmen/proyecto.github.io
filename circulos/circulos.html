<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibujar círculos</title>
</head>
<body>
    <h1>Dibujar círculos</h1>

    <form action="circulos.php" method="POST" target="dibujo">
        Forma:
        <select name="forma">
            <option value="uno">Un círculo</option>
            <option value="filas">Filas de círculos</option>
            <option value="equis">Círculos en X</option>
            <option value="concentricos">Círculos concéntricos</option>
            <option value="tamanos">Círculos de distintos tamaños</option>
            <option value="redondo">Círculos alrededor del centro</option>
            <option value="flor">Flor de círculos</option>
        </select>
        <br><br>
        Centro X: <input type="number" name="x" min="0" max="400" value="200" required>
        Centro Y: <input type="number" name="y" min="0" max="400" value="200" required>
        <br><br>
        Radio (tamaño): <input type="number" name="radio" min="5" max="80" value="30" required>
        Cantidad: <input type="number" name="cantidad" min="2" max="50" value="12" required>
        <br><br>
        <input type="submit" name="dibujar" value="Dibujar">
        <input type="submit" name="borrar" value="Borrar todo">
    </form>

    <h2>El dibujo</h2>
    <iframe src="circulos.php" name="dibujo" width="420" height="420"></iframe>
</body>
</html>
